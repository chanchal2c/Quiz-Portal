
{% extends 'master/base.html' %}

{% block body %}

<div class="my-4 w-75 mx-auto">
    <h2>Questions</h2>
    <h5 class="text-muted">{{ quiz_data.title }}</h5>
    <a href="{% url 'question_add_view' quiz_data.id %}" class="btn btn-success">+ Add Question</a>
</div>

<div class="w-75 mx-auto">
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>SL No.</th>
                <th>Question</th>
                <th width="250">Action</th>
            </tr>
        </thead>

        <tbody>
            {% for questions in question_data %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ questions.question }}</td>
                <td>
                    <a href="{% url 'question_edit_view' questions.id %}" class="btn btn-warning">Edit</a>
                    <a href="{% url 'question_delete_view' questions.id %}" class="btn btn-danger">Delete</a>
                    <a href="{% url 'option_list_view' questions.id %}" class="btn btn-primary">Options</a>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="3" class="text-center">No Questions Found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock body %}
